
<script>
(() => {
  "use strict";

  const $ = id => document.getElementById(id);
  const KEY = "vorratsregal:extras:v2";

  let data = { shopping: [], recipes: [], planner: {} };

  try {
    data = { ...data, ...JSON.parse(localStorage.getItem(KEY) || "{}") };
  } catch (e) {}

  const style = document.createElement("style");
  style.textContent = `
    body:not(.authenticated) #extraNav,
    body:not(.authenticated) .extraPage { display:none !important; }

    #extraNav {
      display:flex; gap:7px; overflow-x:auto; padding:10px 14px;
      background:var(--bg); position:sticky; top:0; z-index:4;
      scrollbar-width:none;
    }
    #extraNav button {
      flex:none; border:1px solid var(--line); border-radius:12px;
      padding:10px 13px; background:var(--card); cursor:pointer;
      font-size:13px; color:var(--ink);
    }
    #extraNav button.active {
      background:var(--acc); color:white; border-color:var(--acc);
    }
    .extraPage { padding:14px; }
    .extraPage h2 { font-size:22px; margin:8px 0 16px; }
    .extraCard {
      background:var(--card); border:1px solid var(--line);
      border-radius:16px; padding:15px; margin-bottom:14px;
    }
    .extraCard h3 { margin:0 0 12px; font-size:16px; }
    .extraStats {
      display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px; margin-bottom:15px;
    }
    .extraStat {
      background:var(--card); border:1px solid var(--line);
      border-radius:15px; padding:15px;
    }
    .extraStat small { color:var(--mut); display:block; }
    .extraStat strong { display:block; font-size:27px; margin-top:5px; }
    .extraRow {
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; padding:11px 0; border-bottom:1px solid var(--line);
    }
    .extraRow:last-child { border-bottom:0; }
    .extraRow button {
      border:1px solid var(--line); border-radius:9px;
      background:var(--bg); padding:8px 11px; cursor:pointer;
    }
    .extraAdd { display:flex; gap:8px; margin-bottom:12px; }
    .extraAdd input { flex:1; min-width:0; }
    .extraPrimary {
      width:100%; padding:12px; margin-top:10px;
      border:0; border-radius:11px; background:var(--acc);
      color:white; font-weight:700; cursor:pointer;
    }
    .extraPage textarea {
      width:100%; padding:11px; border:1px solid var(--line);
      border-radius:10px; background:var(--bg); color:var(--ink);
      font:inherit; resize:vertical;
    }
    .extraPage label { margin-top:12px; }
    .extraMeal {
      background:var(--card); border:1px solid var(--line);
      border-radius:12px; padding:12px; margin-bottom:9px;
    }
    .extraMeal strong { display:block; margin-bottom:7px; }
    .extraMeal select { width:100%; }
    .extraMuted { color:var(--mut); font-size:13px; }
    #usbBarcode { font-size:18px; letter-spacing:1px; }
  `;
  document.head.appendChild(style);

  const nav = document.createElement("nav");
  nav.id = "extraNav";
  nav.innerHTML = `
    <button data-page="dashboard">🏠 Dashboard</button>
    <button data-page="vorrat">🥫 Vorräte</button>
    <button data-page="einkauf">🛒 Einkauf</button>
    <button data-page="rezepte">🍲 Rezepte</button>
    <button data-page="plan">📅 Essensplan</button>
  `;
  $("shelves").parentNode.insertBefore(nav, $("shelves"));

  const pages = document.createElement("div");
  pages.innerHTML = `
    <section id="dashboard" class="extraPage">
      <h2>Dein Dashboard</h2>
      <div class="extraStats">
        <div class="extraStat"><small>Produkte</small><strong id="xProducts">0</strong></div>
        <div class="extraStat"><small>Einheiten</small><strong id="xUnits">0</strong></div>
        <div class="extraStat"><small>Einkauf</small><strong id="xShopping">0</strong></div>
        <div class="extraStat"><small>Bald ablaufend</small><strong id="xExpiry">0</strong></div>
      </div>
      <div class="extraCard">
        <h3>⚠️ MHD im Blick behalten</h3>
        <div id="xExpiryList"></div>
      </div>
      <div class="extraCard">
        <h3>🛒 Deine Einkaufsliste</h3>
        <div id="xShoppingPreview"></div>
      </div>
      <div class="extraCard">
        <h3>🍲 Deine Rezepte</h3>
        <div id="xRecipePreview"></div>
      </div>
    </section>

    <section id="einkauf" class="extraPage" hidden>
      <h2>🛒 Einkaufsliste</h2>
      <div class="extraCard">
        <div class="extraAdd">
          <input id="xShopInput" placeholder="Produkt hinzufügen …">
          <button id="xShopAdd" class="extraPrimary" style="width:55px;margin:0">+</button>
        </div>
        <div id="xShopList"></div>
        <button id="xClearDone" class="extraPrimary">Erledigte entfernen</button>
      </div>
    </section>

    <section id="rezepte" class="extraPage" hidden>
      <h2>🍲 Meine Rezepte</h2>
      <div class="extraCard">
        <h3>Neues Rezept</h3>
        <label>Rezeptname</label>
        <input id="xRecipeName" placeholder="z. B. Gemüsepfanne">
        <label>Zutaten – eine pro Zeile</label>
        <textarea id="xIngredients" rows="5" placeholder="Kartoffeln&#10;Karotten&#10;Zwiebeln"></textarea>
        <label>Zubereitung</label>
        <textarea id="xInstructions" rows="4" placeholder="So wird es zubereitet …"></textarea>
        <button id="xRecipeSave" class="extraPrimary">Rezept speichern</button>
      </div>
      <div id="xRecipeList"></div>
    </section>

    <section id="plan" class="extraPage" hidden>
      <h2>📅 Wochenplaner</h2>
      <p class="extraMuted">Plane deine Mahlzeiten für die Woche.</p>
      <div id="xMealPlan"></div>
    </section>

    <section id="vorrat" class="extraPage" hidden>
      <h2>🥫 Vorräte & Barcode-Scanner</h2>
      <div class="extraCard">
        <h3>🔌 USB-Barcode-Scanner</h3>
        <p class="extraMuted">
          Die meisten USB-Scanner funktionieren wie eine Tastatur.
          Klicke ins Feld und scanne einen Barcode.
        </p>
        <label>Scan-Modus</label>
        <select id="xUsbMode">
          <option value="in">➕ Einlagern</option>
          <option value="out">➖ Entnehmen</option>
        </select>
        <label>Barcode</label>
        <input id="usbBarcode" placeholder="Hier scannen …" autocomplete="off">
        <p id="xUsbStatus" class="extraMuted">Scanner wartet auf Eingabe.</p>
        <button id="xUsbFocus" class="extraPrimary">Scanner aktivieren</button>
      </div>
    </section>
  `;
  nav.parentNode.insertBefore(pages, $("shelves"));

  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify(data));
    } catch (e) {
      if (typeof toast === "function") toast("Speicher voll oder nicht verfügbar.");
    }
    refresh();
  };

  const escText = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"
  }[c]));

  function showPage(page) {
    document.querySelectorAll(".extraPage").forEach(section => {
      section.hidden = section.id !== page;
    });

    $("shelves").hidden = page !== "vorrat";
    $("scan").hidden = page !== "vorrat";

    document.querySelectorAll("#extraNav button").forEach(button => {
      button.classList.toggle("active", button.dataset.page === page);
    });

    if (page === "einkauf") renderShopping();
    if (page === "rezepte") renderRecipes();
    if (page === "plan") renderPlan();
    if (page === "dashboard") refresh();
  }

  nav.addEventListener("click", e => {
    const button = e.target.closest("[data-page]");
    if (button) showPage(button.dataset.page);
  });

  function inventory() {
    return Object.values(P || {});
  }

  function productTotal(product) {
    return (product.batches || []).reduce((sum, batch) => sum + Number(batch.qty || 0), 0);
  }

  function missingIngredients(recipe) {
    const stocked = inventory()
      .filter(product => productTotal(product) > 0)
      .map(product => String(product.name || "").toLowerCase());

    return recipe.ingredients.filter(ingredient => {
      const name = ingredient.toLowerCase();
      return !stocked.some(product => product.includes(name) || name.includes(product));
    });
  }

  function refresh() {
    const products = inventory();
    const units = products.reduce((sum, p) => sum + productTotal(p), 0);
    const stocked = products.filter(p => productTotal(p) > 0);
    const expiry = [];

    products.forEach(product => {
      (product.batches || []).forEach(batch => {
        if (!batch.mhd || Number(batch.qty) <= 0) return;
        const days = Math.floor(
          (new Date(batch.mhd + "T12:00:00") - new Date()) / 86400000
        );
        if (days <= 30) expiry.push({
          name: product.name,
          date: batch.mhd,
          days,
          qty: batch.qty
        });
      });
    });

    expiry.sort((a, b) => a.days - b.days);

    $("xProducts").textContent = stocked.length;
    $("xUnits").textContent = units;
    $("xShopping").textContent = data.shopping.filter(x => !x.done).length;
    $("xExpiry").textContent = expiry.length;

    $("xExpiryList").innerHTML = expiry.length
      ? expiry.map(item => `
        <div class="extraRow">
          <span>
            <b>${escText(item.name)}</b><br>
            <small>${item.days < 0 ? "Abgelaufen" : "Noch " + item.days + " Tage"}
            · ${new Date(item.date + "T12:00:00").toLocaleDateString("de-DE")}</small>
          </span>
          <span>× ${item.qty}</span>
        </div>
      `).join("")
      : '<p class="extraMuted">Alles im grünen Bereich! 🎉</p>';

    const open = data.shopping.filter(x => !x.done);
    $("xShoppingPreview").innerHTML = open.length
      ? open.slice(0, 5).map(x => `
        <div class="extraRow">${escText(x.name)} × ${x.qty || 1}</div>
      `).join("")
      : '<p class="extraMuted">Deine Einkaufsliste ist leer.</p>';

    $("xRecipePreview").innerHTML = data.recipes.length
      ? data.recipes.slice(0, 4).map(x => `<div class="extraRow">${escText(x.name)}</div>`).join("")
      : '<p class="extraMuted">Noch keine Rezepte gespeichert.</p>';
  }

  function addShopping(name) {
    name = String(name || "").trim();
    if (!name) return;

    const existing = data.shopping.find(x =>
      !x.done && x.name.toLowerCase() === name.toLowerCase()
    );

    if (existing) existing.qty = (existing.qty || 1) + 1;
    else data.shopping.push({ id: Date.now() + Math.random(), name, qty: 1, done: false });

    save();
    renderShopping();
  }

  function renderShopping() {
    $("xShopList").innerHTML = data.shopping.length
      ? data.shopping.map(item => `
        <div class="extraRow">
          <label style="display:flex;align-items:center;gap:9px;margin:0;flex:1">
            <input type="checkbox" data-shop-check="${item.id}"
              ${item.done ? "checked" : ""} style="width:auto">
            <span style="${item.done ? "text-decoration:line-through;opacity:.5" : ""}">
              ${escText(item.name)} × ${item.qty || 1}
            </span>
          </label>
          <button data-shop-delete="${item.id}">✕</button>
        </div>
      `).join("")
      : '<p class="extraMuted">Noch keine Einkäufe eingetragen.</p>';
  }

  $("xShopAdd").onclick = () => {
    addShopping($("xShopInput").value);
    $("xShopInput").value = "";
    $("xShopInput").focus();
  };

  $("xShopInput").addEventListener("keydown", e => {
    if (e.key === "Enter") $("xShopAdd").click();
  });

  $("xShopList").addEventListener("change", e => {
    const id = e.target.dataset.shopCheck;
    if (!id) return;
    const item = data.shopping.find(x => String(x.id) === id);
    if (item) item.done = e.target.checked;
    save();
    renderShopping();
  });

  $("xShopList").addEventListener("click", e => {
    const id = e.target.dataset.shopDelete;
    if (!id) return;
    data.shopping = data.shopping.filter(x => String(x.id) !== id);
    save();
    renderShopping();
  });

  $("xClearDone").onclick = () => {
    data.shopping = data.shopping.filter(x => !x.done);
    save();
    renderShopping();
  };

  $("xRecipeSave").onclick = () => {
    const name = $("xRecipeName").value.trim();
    const ingredients = $("xIngredients").value
      .split("\n").map(x => x.trim()).filter(Boolean);
    const instructions = $("xInstructions").value.trim();

    if (!name || !ingredients.length) {
      alert("Bitte gib einen Namen und mindestens eine Zutat ein.");
      return;
    }

    data.recipes.push({
      id: Date.now(),
      name,
      ingredients,
      instructions
    });

    $("xRecipeName").value = "";
    $("xIngredients").value = "";
    $("xInstructions").value = "";

    save();
    renderRecipes();
    if (typeof toast === "function") toast("Rezept gespeichert!");
  };

  function renderRecipes() {
    $("xRecipeList").innerHTML = data.recipes.length
      ? data.recipes.map(recipe => {
        const missing = missingIngredients(recipe);
        return `
          <div class="extraCard">
            <h3>🍽️ ${escText(recipe.name)}</h3>
            <b>Zutaten</b>
            <p>${recipe.ingredients.map(escText).join("<br>")}</p>
            <b>Zubereitung</b>
            <p>${escText(recipe.instructions || "Keine Zubereitung angegeben.")}</p>
            <p class="extraMuted">
              ${missing.length
                ? "Fehlt noch: " + missing.map(escText).join(", ")
                : "Alle Zutaten scheinen vorhanden zu sein! 🎉"}
            </p>
            <button class="extraPrimary" data-recipe-add="${recipe.id}">
              Fehlende Zutaten einkaufen
            </button>
            <button data-recipe-delete="${recipe.id}"
              style="width:100%;padding:10px;margin-top:7px;border:1px solid var(--line);border-radius:10px;background:var(--bg)">
              Rezept löschen
            </button>
          </div>
        `;
      }).join("")
      : '<p class="extraMuted">Du hast noch keine Rezepte gespeichert.</p>';
  }

  $("xRecipeList").addEventListener("click", e => {
    const addId = e.target.dataset.recipeAdd;
    const deleteId = e.target.dataset.recipeDelete;

    if (addId) {
      const recipe = data.recipes.find(x => String(x.id) === addId);
      if (!recipe) return;
      const missing = missingIngredients(recipe);
      missing.forEach(addShopping);
      if (typeof toast === "function") {
        toast(missing.length ? "Zutaten zur Einkaufsliste hinzugefügt." : "Alles vorhanden!");
      }
    }

    if (deleteId) {
      data.recipes = data.recipes.filter(x => String(x.id) !== deleteId);
      save();
      renderRecipes();
    }
  });

  const days = ["Montag", "Dienstag", "Mittwoch", "Donnerstag",
    "Freitag", "Samstag", "Sonntag"];

  function renderPlan() {
    $("xMealPlan").innerHTML = days.map(day => `
      <div class="extraMeal">
        <strong>${day}</strong>
        <select data-plan-day="${day}">
          <option value="">Mahlzeit auswählen …</option>
          ${data.recipes.map(recipe => `
            <option value="${recipe.id}"
              ${String(data.planner[day] || "") === String(recipe.id) ? "selected" : ""}>
              ${escText(recipe.name)}
            </option>
          `).join("")}
        </select>
      </div>
    `).join("");

    $("xMealPlan").querySelectorAll("select").forEach(select => {
      select.addEventListener("change", () => {
        data.planner[select.dataset.planDay] = select.value;
        save();
      });
    });
  }

  $("xUsbFocus").onclick = () => {
    $("usbBarcode").focus();
    $("xUsbStatus").textContent = "Bereit – jetzt Barcode scannen.";
  };

  $("usbBarcode").addEventListener("keydown", e => {
    if (e.key !== "Enter") return;
    e.preventDefault();

    const code = $("usbBarcode").value.replace(/\D/g, "");
    $("usbBarcode").value = "";

    if (code.length < 6) {
      $("xUsbStatus").textContent = "Der Barcode ist zu kurz.";
      return;
    }

    $("xUsbStatus").textContent = "Barcode erkannt: " + code;

    if (typeof found !== "function") {
      $("xUsbStatus").textContent = "Die vorhandene Scan-Funktion wurde nicht gefunden.";
      return;
    }

    mode = $("xUsbMode").value;
    found(code);
  });

  // Dashboard nach Änderungen am Vorratsbestand aktualisieren.
  const originalRender = render;
  render = function() {
    originalRender();
    refresh();
  };

  renderShopping();
  renderRecipes();
  renderPlan();
  refresh();
  showPage("dashboard");

})();
</script>
